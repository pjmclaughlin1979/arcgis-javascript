<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Stormont Parliament Buildings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/themes/light/main.css" />
  <script type="module" src="https://js.arcgis.com/5.1/"></script>
  <style>
    :root {
      --ink: #1d222b;
      --muted: #6b7280;
      --panel: rgba(255, 255, 255, 0.84);
      --panel-line: rgba(29, 34, 43, 0.08);
      --accent: #2f5d8a;
      --track: rgba(29, 34, 43, 0.12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f1ea; }
    body { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
    #view { position: absolute; inset: 0; outline: none; }

    .panel {
      background: var(--panel);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      border: 1px solid var(--panel-line);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(20, 24, 32, 0.12);
    }

    #caption { position: absolute; top: 20px; left: 20px; width: 350px; max-width: calc(100vw - 32px); padding: 18px 20px; }
    #captionHeader { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    #caption .eyebrow { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    #caption h1 { font-size: 20px; line-height: 1.2; margin: 6px 0 14px; font-weight: 700; letter-spacing: -.01em; }
    #captionToggle { flex: none; width: 32px; height: 32px; margin: -4px -6px 0 0; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; }
    #captionToggle:hover { background: rgba(29, 34, 43, 0.06); color: var(--ink); }
    #captionToggle:focus-visible { outline: 3px solid rgba(47, 93, 138, .45); outline-offset: 2px; }
    #captionToggle svg { width: 18px; height: 18px; transition: transform .2s; }
    #caption.collapsed #captionToggle svg { transform: rotate(180deg); }
    #caption.collapsed #captionDetails { display: none; }
    #caption .stage-row { display: flex; align-items: baseline; gap: 10px; }
    #stageNum { font-size: 34px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--accent); }
    #stageName { font-size: 17px; font-weight: 600; }
    #stageDesc { margin: 6px 0 0; font-size: 13.5px; line-height: 1.5; color: #454b55; min-height: 4.5em; transition: opacity .35s ease; }
    #controlsHelp { margin: 10px 0 0; font-size: 12px; color: #454b55; line-height: 1.7; }
    #controlsHelp b { color: var(--ink); font-weight: 600; }
    #caption .coords { display: flex; align-items: center; gap: 6px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--panel-line); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    #caption .coords svg { width: 14px; height: 14px; flex: none; }

    #dock {
      position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
      width: min(760px, calc(100vw - 32px));
      padding: 14px 16px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
    }
    .btn {
      appearance: none; border: 1px solid var(--panel-line); background: #fff; color: var(--ink);
      width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; cursor: pointer;
      transition: background .2s, color .2s, transform .1s, border-color .2s;
    }
    .btn:hover { border-color: rgba(29, 34, 43, 0.25); }
    .btn:active { transform: scale(.96); }
    .btn:focus-visible { outline: 3px solid rgba(47, 93, 138, .45); outline-offset: 2px; }
    .btn[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
    .btn svg { width: 18px; height: 18px; }
    .tools { display: flex; gap: 8px; }

    #scrub { position: relative; padding-top: 2px; }
    #stages { display: grid; grid-template-columns: repeat(4, 1fr); margin: 0 -6px 6px; }
    #stages button {
      appearance: none; border: 0; background: none; cursor: pointer; font: inherit; color: var(--muted);
      font-size: 12.5px; font-weight: 600; padding: 4px 6px; text-align: center; border-radius: 8px; transition: color .25s;
    }
    #stages button:first-child { text-align: left; }
    #stages button:last-child { text-align: right; }
    #stages button span { font-variant-numeric: tabular-nums; opacity: .6; margin-right: 4px; }
    #stages button.active, #stages button:hover { color: var(--ink); }
    #stages button:focus-visible { outline: 3px solid rgba(47, 93, 138, .45); }

    #rangeWrap { position: relative; height: 22px; }
    #track { position: absolute; left: 0; right: 0; top: 50%; height: 4px; margin-top: -2px; border-radius: 4px; background: var(--track); overflow: hidden; }
    #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #8a93a3, #1d222b 45%, var(--accent)); border-radius: 4px; }
    .tick { position: absolute; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #fff; border: 2px solid #b8bec8; pointer-events: none; transition: border-color .25s, background .25s; }
    .tick.on { border-color: var(--ink); background: var(--ink); }
    #range { position: absolute; inset: 0; width: 100%; margin: 0; opacity: 0; cursor: pointer; }
    #thumb { position: absolute; top: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.2); pointer-events: none; }
    #range:focus-visible + #thumb { outline: 3px solid rgba(47, 93, 138, .45); outline-offset: 2px; }

    #navTools { position: absolute; right: 20px; top: 20px; display: flex; flex-direction: column; gap: 8px; filter: drop-shadow(0 4px 12px rgba(20, 24, 32, 0.14)); }

    #loader {
      position: absolute; inset: 0; display: grid; place-items: center; background: #f4f1ea; z-index: 10;
      transition: opacity .8s ease; font-size: 13px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase;
    }
    #loader.gone { opacity: 0; pointer-events: none; }
    #loader .bar { width: 160px; height: 2px; background: var(--track); margin-top: 14px; overflow: hidden; border-radius: 2px; }
    #loader .bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--ink); animation: load 1.1s ease-in-out infinite; }
    @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    #loader.error .bar { display: none; }

    @media (max-width: 720px) {
      #caption { top: 12px; left: 12px; padding: 14px 16px; width: calc(100vw - 88px); }
      #caption h1 { font-size: 17px; margin-bottom: 8px; }
      #stageNum { font-size: 26px; }
      #stageDesc { font-size: 12.5px; min-height: 0; }
      #controlsHelp { display: none; }
      #navTools { right: 12px; top: 12px; }
      #dock { bottom: 12px; grid-template-columns: auto 1fr auto; gap: 10px; }
      #scrub { grid-column: 1 / -1; order: -1; }
      #dock .tools:last-child { grid-column: 3; }
      #stages button { font-size: 11px; }
      #stages button span { display: none; }
    }
  </style>
</head>
<body>
  <div id="view" tabindex="0" aria-label="3D view of the Parliament Buildings at Stormont"></div>

  <section id="caption" class="panel" aria-live="polite">
    <div id="captionHeader">
      <div>
        <div class="eyebrow">Stormont Estate · Belfast</div>
        <h1>Parliament Buildings</h1>
      </div>
      <button id="captionToggle" type="button" aria-expanded="true" aria-controls="captionDetails" aria-label="Collapse stage information" title="Collapse stage information">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>
    <div id="captionDetails">
      <div class="stage-row"><div id="stageNum">01</div><div id="stageName">Sketch</div></div>
      <p id="stageDesc"></p>
      <p id="controlsHelp"><b>Drag</b> orbit · <b>Right-drag</b> pan · <b>Scroll</b> zoom<br><b>1–4</b> stages · <b>Space</b> play · <b>O</b> auto-orbit · <b>R</b> reset · <b>E</b> export OBJ</p>
      <div class="coords"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>54.6050° N, 5.8319° W · schematic model</div>
    </div>
  </section>

  <div id="navTools" aria-label="Map navigation">
    <arcgis-zoom id="navZoom"></arcgis-zoom>
    <arcgis-navigation-toggle id="navToggle" navigation-mode="rotate"></arcgis-navigation-toggle>
    <arcgis-compass id="navCompass"></arcgis-compass>
  </div>

  <section id="dock" class="panel">
    <div class="tools">
      <button id="play" class="btn" aria-pressed="false" title="Play through the stages (Space)" aria-label="Play">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
      </button>
    </div>
    <div id="scrub">
      <div id="stages" role="tablist" aria-label="Stages">
        <button data-stage="0" class="active" role="tab"><span>01</span>Sketch</button>
        <button data-stage="1" role="tab"><span>02</span>Massing</button>
        <button data-stage="2" role="tab"><span>03</span>Detail</button>
        <button data-stage="3" role="tab"><span>04</span>Finish</button>
      </div>
      <div id="rangeWrap">
        <div id="track"><div id="fill"></div></div>
        <div class="tick" style="left:0%"></div>
        <div class="tick" style="left:33.333%"></div>
        <div class="tick" style="left:66.667%"></div>
        <div class="tick" style="left:100%"></div>
        <input id="range" type="range" min="0" max="3000" step="1" value="0" aria-label="Stage scrubber" />
        <div id="thumb"></div>
      </div>
    </div>
    <div class="tools">
      <button id="orbit" class="btn" aria-pressed="false" title="Auto-orbit (O)" aria-label="Auto-orbit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 4 0 1 1-4.5-3.46"/><path d="M17 5.5l-.5 3 3 .5"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>
      </button>
      <button id="export" class="btn" title="Download the finished model as OBJ (E)" aria-label="Download model as OBJ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 19h14"/></svg>
      </button>
      <button id="reset" class="btn" title="Reset view (R)" aria-label="Reset view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.34-5.66"/><path d="M4 4v4h4"/></svg>
      </button>
    </div>
  </section>

  <div id="loader"><div style="text-align:center"><div id="loaderText">Loading scene</div><div class="bar"></div></div></div>

  <script type="module">
    const [
      Map, SceneView, Graphic, GraphicsLayer, Mesh, MeshComponent, MeshMaterialMetallicRoughness,
      MeshTexture, MeshLocalVertexSpace, MeshTransform, Point, Polyline, Polygon, SpatialReference, Camera, WebStyleSymbol
    ] = await $arcgis.import([
      "@arcgis/core/Map.js",
      "@arcgis/core/views/SceneView.js",
      "@arcgis/core/Graphic.js",
      "@arcgis/core/layers/GraphicsLayer.js",
      "@arcgis/core/geometry/Mesh.js",
      "@arcgis/core/geometry/support/MeshComponent.js",
      "@arcgis/core/geometry/support/MeshMaterialMetallicRoughness.js",
      "@arcgis/core/geometry/support/MeshTexture.js",
      "@arcgis/core/geometry/support/MeshLocalVertexSpace.js",
      "@arcgis/core/geometry/support/MeshTransform.js",
      "@arcgis/core/geometry/Point.js",
      "@arcgis/core/geometry/Polyline.js",
      "@arcgis/core/geometry/Polygon.js",
      "@arcgis/core/geometry/SpatialReference.js",
      "@arcgis/core/Camera.js",
      "@arcgis/core/symbols/WebStyleSymbol.js"
    ]);

    // ------------------------------------------------------------------
    // Site frame. Everything is authored in metres in a local frame centred
    // on the building (x east, y north, z up); the ground is flat at z = 0.
    // The building faces west down Prince of Wales Avenue. Dimensions follow
    // the published figures (365 ft x 164 ft, about 21 m to the parapet);
    // the plan and elevations are a simplified reading of the design.
    // ------------------------------------------------------------------
    const SR = SpatialReference.WebMercator;
    const SITE = { lon: -5.83188, lat: 54.60502 };
    const R_EARTH = 6378137;
    const X0 = (SITE.lon * Math.PI / 180) * R_EARTH;
    const Y0 = Math.log(Math.tan(Math.PI / 4 + (SITE.lat * Math.PI / 180) / 2)) * R_EARTH;
    const K = 1 / Math.cos(SITE.lat * Math.PI / 180);      // metres -> Web Mercator units
    const P = (x, y, z = 0) => [X0 + x * K, Y0 + y * K, z];
    const toLocal = (pt) => {
      let { x, y } = pt;
      if (pt.spatialReference?.isWGS84) { x = (pt.longitude * Math.PI / 180) * R_EARTH; y = Math.log(Math.tan(Math.PI / 4 + (pt.latitude * Math.PI / 180) / 2)) * R_EARTH; }
      return [(x - X0) / K, (y - Y0) / K, pt.z ?? 0];
    };

    // Levels
    const Z0 = 2.4;    // terrace / ground floor
    const Z1 = 8.2;    // principal floor
    const Z2 = 14.8;   // upper floor
    const ZR = 19.6;   // roof slab / cornice base
    const ZC = 20.8;   // top of cornice
    const ZP = 22.0;   // top of balustrade
    const ZA = 24.4;   // top of the central attic
    const TH = 0.6;    // external wall thickness

    function rng(seed) {
      return () => {
        seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
    const lerp = (a, b, t) => a + (b - a) * t;
    const lerpColor = (c1, c2, t) => c1.map((v, i) => Math.round(lerp(v, c2[i], t)));
    const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);

    // ------------------------------------------------------------------
    // Procedural textures for the finished materials
    // ------------------------------------------------------------------
    function canvasTex(size, draw) {
      const c = document.createElement("canvas");
      c.width = c.height = size;
      draw(c.getContext("2d", { willReadFrequently: true }), size);
      return c;
    }
    function noise(ctx, s, amount, seed) {
      const img = ctx.getImageData(0, 0, s, s), d = img.data, r = rng(seed);
      for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * amount; d[i] += n; d[i + 1] += n; d[i + 2] += n; d[i + 3] = 255; }
      ctx.putImageData(img, 0, 0);
    }
    function ashlar(base, rows, cols, seed, groove, grooveAlpha) {
      return (ctx, s) => {
        const r = rng(seed), h = s / rows;
        ctx.fillStyle = `rgb(${base})`; ctx.fillRect(0, 0, s, s);
        for (let i = 0; i < rows; i++) {
          const off = i % 2 ? s / cols / 2 : 0;
          for (let j = -1; j <= cols; j++) {
            const sh = (r() - 0.5) * 16;
            ctx.fillStyle = `rgb(${base.map(v => v + sh).join(",")})`;
            ctx.fillRect(off + j * s / cols, i * h, s / cols, h);
            ctx.fillStyle = `rgba(80,72,60,${grooveAlpha * 0.8})`;
            ctx.fillRect(off + j * s / cols, i * h, Math.max(2, groove / 2), h);
          }
          ctx.fillStyle = `rgba(70,62,50,${grooveAlpha})`; ctx.fillRect(0, i * h, s, groove);
          ctx.fillStyle = "rgba(255,255,255,.18)"; ctx.fillRect(0, i * h + groove, s, 2);
        }
        for (let k = 0; k < 1400; k++) { ctx.fillStyle = `rgba(110,100,85,${r() * 0.12})`; ctx.beginPath(); ctx.arc(r() * s, r() * s, r() * 1.8, 0, 7); ctx.fill(); }
        // weathering streaks
        for (let k = 0; k < 40; k++) { ctx.fillStyle = `rgba(90,85,75,${r() * 0.05})`; ctx.fillRect(r() * s, r() * s, 1 + r() * 3, s * r() * 0.4); }
        noise(ctx, s, 12, seed + 1);
      };
    }
    function planks(base, count, seed) {
      return (ctx, s) => {
        const r = rng(seed), w = s / count;
        for (let i = 0; i < count; i++) {
          const sh = (r() - 0.5) * 22;
          ctx.fillStyle = `rgb(${base.map(v => Math.max(0, Math.min(255, v + sh))).join(",")})`; ctx.fillRect(0, i * w, s, w);
          for (let k = 0; k < 16; k++) { ctx.fillStyle = `rgba(0,0,0,${0.03 + r() * 0.05})`; ctx.fillRect(r() * s, i * w + r() * w, s * (0.3 + r() * 0.7), 1); }
          ctx.fillStyle = "rgba(60,40,20,.35)"; ctx.fillRect(0, i * w, s, 1);
        }
        noise(ctx, s, 20, seed + 1);
      };
    }
    const TEX = {
      stone: canvasTex(512, ashlar([228, 224, 212], 4, 2, 7, 2, 0.16)),
      stonePlain: canvasTex(256, (ctx, s) => { ctx.fillStyle = "rgb(228,224,212)"; ctx.fillRect(0, 0, s, s); noise(ctx, s, 14, 61); }),
      rustic: canvasTex(512, ashlar([218, 213, 199], 4, 1, 17, 9, 0.45)),
      granite: canvasTex(256, (ctx, s) => {
        ctx.fillStyle = "#8e8784"; ctx.fillRect(0, 0, s, s);
        const r = rng(3);
        for (let k = 0; k < 5000; k++) {
          const c = r() < 0.45 ? [60, 58, 58] : r() < 0.6 ? [190, 160, 150] : [205, 200, 196];
          ctx.fillStyle = `rgba(${c},${0.3 + r() * 0.5})`; ctx.fillRect(r() * s, r() * s, 1 + r() * 2.5, 1 + r() * 2.5);
        }
        ctx.fillStyle = "rgba(40,36,34,.45)"; ctx.fillRect(0, 0, s, 2); ctx.fillRect(0, s / 2, s, 2); ctx.fillRect(0, 0, 2, s / 2); ctx.fillRect(s / 2, s / 2, 2, s / 2);
      }),
      lead: canvasTex(256, (ctx, s) => {
        ctx.fillStyle = "#6f777c"; ctx.fillRect(0, 0, s, s);
        const r = rng(9);
        for (let i = 0; i < 4; i++) {
          const sh = (r() - 0.5) * 12; ctx.fillStyle = `rgb(${111 + sh},${119 + sh},${124 + sh})`; ctx.fillRect(i * s / 4, 0, s / 4, s);
          ctx.fillStyle = "rgba(255,255,255,.22)"; ctx.fillRect(i * s / 4, 0, 3, s);
          ctx.fillStyle = "rgba(0,0,0,.28)"; ctx.fillRect(i * s / 4 + 3, 0, 2, s);
        }
        noise(ctx, s, 18, 10);
      }),
      oak: canvasTex(256, planks([172, 130, 86], 8, 31)),
      carpet: canvasTex(128, (ctx, s) => { ctx.fillStyle = "#34456a"; ctx.fillRect(0, 0, s, s); noise(ctx, s, 26, 41); }),
      marble: canvasTex(256, (ctx, s) => {
        ctx.fillStyle = "#e6ddcc"; ctx.fillRect(0, 0, s, s);
        const r = rng(51);
        ctx.strokeStyle = "rgba(150,130,105,.25)";
        for (let k = 0; k < 20; k++) { ctx.lineWidth = r() * 2; ctx.beginPath(); ctx.moveTo(r() * s, 0); ctx.bezierCurveTo(r() * s, s / 3, r() * s, s * 2 / 3, r() * s, s); ctx.stroke(); }
        ctx.fillStyle = "rgba(120,100,80,.35)"; ctx.fillRect(0, 0, s, 1); ctx.fillRect(0, 0, 1, s);
        noise(ctx, s, 8, 52);
      })
    };

    // ------------------------------------------------------------------
    // Materials: [material, texture repeat size in metres]
    // ------------------------------------------------------------------
    const mat = (o) => new MeshMaterialMetallicRoughness(Object.assign({ metallic: 0, roughness: 0.85, doubleSided: true }, o));
    const texMat = (tex, o = {}) => mat(Object.assign({ colorTexture: new MeshTexture({ data: tex, wrap: "repeat" }) }, o));
    const glassMat = (color, o = {}) => mat(Object.assign({ color, alphaMode: "blend", metallic: 0.2, roughness: 0.08 }, o));
    const emissive = (rgb, strength) => mat({ color: rgb, emissiveColor: rgb, emissiveStrength: strength, roughness: 1 });
    const M = {
      white:      [mat({ color: [246, 246, 243] }), 1],
      whiteWarm:  [mat({ color: [238, 236, 230] }), 1],
      floorWhite: [mat({ color: [206, 207, 204] }), 1],
      frameGrey:  [mat({ color: [160, 165, 172], roughness: 0.6 }), 1],
      glassWhite: [glassMat([190, 216, 236, 0.4]), 1],
      treeWhite:  [mat({ color: [250, 250, 248] }), 1],

      stone:   [texMat(TEX.stone, { roughness: 0.92 }), 2.4],
      stonePlain: [texMat(TEX.stonePlain, { roughness: 0.9 }), 3],
      rustic:  [texMat(TEX.rustic, { roughness: 0.95 }), 2.4],
      granite: [texMat(TEX.granite, { roughness: 0.8 }), 1.6],
      lead:    [texMat(TEX.lead, { metallic: 0.3, roughness: 0.6 }), 2.2],
      sash:    [mat({ color: [242, 242, 238], roughness: 0.5 }), 1],
      glass:   [glassMat([74, 96, 114, 0.36], { metallic: 0.55, roughness: 0.05 }), 1],
      door:    [mat({ color: [52, 40, 30], roughness: 0.55 }), 1],
      carpet:  [texMat(TEX.carpet, { roughness: 1 }), 1.5],
      oak:     [texMat(TEX.oak, { roughness: 0.55 }), 1.8],

      setOpacity(L_glassWhite, smooth(1.3, 1.8, t) * out(2.2, 2.75));
      setOpacity(L_furnWhite, smooth(1.45, 1.95, t) * out(2.2, 2.75));
      setOpacity(L_treesWhite, smooth(1.5, 2.0, t) * out(2.2, 2.75));
      setOpacity(L_archFin, smooth(2.2, 2.75, t));
      setOpacity(L_furnFin, smooth(2.2, 2.75, t));
      setOpacity(L_glassFin, smooth(2.25, 2.8, t));
      setOpacity(L_roofFin, smooth(2.45, 2.9, t));
      setOpacity(L_site, smooth(2.15, 2.7, t));
      setOpacity(L_roads, smooth(2.25, 2.8, t));
      setOpacity(L_paths, smooth(2.35, 2.85, t));
      setOpacity(L_cars, smooth(2.5, 2.95, t));
      setOpacity(L_treesFin, realTrees.ready ? 0 : smooth(2.3, 2.8, t));
      setOpacity(L_treesReal, realTrees.ready ? smooth(2.3, 2.8, t) : 0);
      setOpacity(L_lights, smooth(2.55, 3.0, t));

      // massing rises out of the terrace
      const rise = Math.round((0.03 + 0.97 * smooth(0.12, 0.95, t)) * 200) / 200;
      if (L_mass.visible) setTransform(massGraphic, "m", [0, 0, 0], [1, 1, rise]);
      // furniture drops into place
      const drop = Math.round((1 - smooth(1.45, 2.0, t)) * 2.2 * 100) / 100;
      if (L_furnWhite.visible) setTransform(furnWhiteGraphic, "f", [0, 0, drop], [1, 1, 1]);
      // trees grow from the ground, staggered by batch
      const grow = (gs, a, b, min) => gs.forEach(g => {
        const s = Math.round((min + (1 - min) * smooth(a + g.delay, b + g.delay, t)) * 100) / 100;
        setTransform(g, "t", [0, 0, 0], [1, 1, s]);
      });
      if (L_treesWhite.visible) grow(treeWhiteGraphics, 1.45, 1.75, 0.05);
      if (L_treesFin.visible) grow(treeFinGraphics, 2.2, 2.5, 0.2);

      // satellite context: faint under the drawing and models, stronger around the finished estate
      const bmo = Math.round((t < 2 ? 0.14 : lerp(0.14, 0.9, smooth(2.1, 2.8, t))) * 200) / 200;
      const bm = map.basemap;
      if (bm && (bm !== last.bm || bmo !== last.bmo)) {
        bm.baseLayers.forEach(l => { l.opacity = bmo; });
        bm.referenceLayers.forEach(l => { l.opacity = bmo; });
        last.bm = bm; last.bmo = bmo;
      }
      const gr = colorAt(GROUND, t);
      if (gr.join() !== last.ground) { map.ground.surfaceColor = gr; last.ground = gr.join(); }
      const d = sunDate(t);
      if (d.getTime() !== last.minutes) { view.environment.lighting.date = d; last.minutes = d.getTime(); }
    }

    // ------------------------------------------------------------------
    // UI
    // ------------------------------------------------------------------
    const LAST = 3;
    const STAGES = [
      ["Sketch", "Pencil linework sets out Sir Arnold Thornely's plan: a 365-foot classical block on a raised terrace, a central portico, light courts, and the avenue climbing to the front."],
      ["Massing", "Solid white volumes rise from the terrace: two ranges wrapped around light courts, the taller central block and the portico with its pediment."],
      ["Detail", "Roof lifted away: sash windows and glazing, floor plates, offices fitted with desks, the Great Hall's chandelier and stair, and the chamber's horseshoe of benches."],
      ["Finish", "Portland stone over a Mourne granite plinth, lead roofs and lit offices, set among lawns, the tree-lined avenue, car parks and lamps under a low September sun."]
    ];
    const $ = (id) => document.getElementById(id);
    const range = $("range"), thumb = $("thumb"), fill = $("fill"), ticks = [...document.querySelectorAll(".tick")];
    const stageBtns = [...document.querySelectorAll("#stages button")];
    let current = 0, target = 0, shownStage = -1, scrubbing = false;

    const caption = $("caption"), captionToggle = $("captionToggle");
    captionToggle.addEventListener("click", () => {
      const expanded = captionToggle.getAttribute("aria-expanded") === "true";
      caption.classList.toggle("collapsed", expanded);
      captionToggle.setAttribute("aria-expanded", String(!expanded));
      captionToggle.setAttribute("aria-label", expanded ? "Expand stage information" : "Collapse stage information");
      captionToggle.title = captionToggle.getAttribute("aria-label");
    });
    if (window.innerWidth < 720) captionToggle.click();

    function updateUI(t) {
      const pct = (t / LAST) * 100;
      thumb.style.left = pct + "%"; fill.style.width = pct + "%";
      if (!scrubbing) range.value = Math.round(t * 1000);
      ticks.forEach((el, i) => el.classList.toggle("on", t >= i - 0.02));
      const s = Math.min(LAST, Math.max(0, Math.round(t)));
      if (s !== shownStage) {
        shownStage = s;
        stageBtns.forEach((b, i) => { b.classList.toggle("active", i === s); b.setAttribute("aria-selected", i === s); });
        $("stageNum").textContent = String(s + 1).padStart(2, "0");
        $("stageName").textContent = STAGES[s][0];
        const desc = $("stageDesc");
        desc.style.opacity = 0;
        setTimeout(() => { desc.textContent = STAGES[shownStage][1]; desc.style.opacity = 1; }, 180);
      }
    }

    range.addEventListener("pointerdown", () => { scrubbing = true; stopPlay(); });
    window.addEventListener("pointerup", () => { scrubbing = false; });
    range.addEventListener("input", () => { stopPlay(); target = range.value / 1000; });
    range.addEventListener("change", () => { scrubbing = false; });
    stageBtns.forEach(b => b.addEventListener("click", () => { stopPlay(); target = +b.dataset.stage; }));

    let playing = false, holdUntil = 0;
    const playBtn = $("play");
    const PLAY_ICON = '<path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/>';
    const PAUSE_ICON = '<rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/>';
    function setPlay(on) {
      playing = on; playBtn.setAttribute("aria-pressed", on); playBtn.setAttribute("aria-label", on ? "Pause" : "Play");
      $("playIcon").innerHTML = on ? PAUSE_ICON : PLAY_ICON;
      if (on) { if (current > LAST - 0.02) { target = 0; current = 0; } holdUntil = performance.now() + 400; }
    }
    function stopPlay() { if (playing) setPlay(false); }
    playBtn.addEventListener("click", () => setPlay(!playing));

    for (const id of ["navZoom", "navToggle", "navCompass"]) {
      const el = $(id);
      customElements.whenDefined(el.localName).then(() => { el.view = view; });
    }
    const orbitBtn = $("orbit");
    function toggleAutoOrbit(on = !autoOrbit) { autoOrbit = on; orbitBtn.setAttribute("aria-pressed", on); if (on) orbit = orbitFromView(); }
    orbitBtn.addEventListener("click", () => toggleAutoOrbit());
    // ------------------------------------------------------------------
    // OBJ export: the finished model (building, interiors, terrace, trees,
    // cars, lamps, statue) as one ZIP holding stormont.obj, stormont.mtl and
    // the procedural textures. Metres, Y up, origin at the building centre on
    // the ground, +X east and -Z north. Draped ground surfaces are not included.
    // ------------------------------------------------------------------
    function buildOBJ() {
      const parts = [["building", archFin], ["roof", roofFin], ["terrace", plinthFin], ["glazing", glassFin], ["interiors", furnFin],
        ["lighting", lights], ["statue", statue], ["cars", carGroups], ...treeFin.map((g, i) => ["trees_" + (i + 1), g])];
      const f3 = (v) => (Math.round(v * 1000) / 1000).toString();
      const obj = ["# Parliament Buildings, Stormont (schematic model)\n# Units: metres. Y up; +X east, -Z north; origin at the building centre on the ground.\nmtllib stormont.mtl\n"];
      const used = new Set();
      let base = 1;
      for (const [name, grp] of parts) {
        obj.push(`o ${name}\n`);
        for (const [key, g] of Object.entries(grp.g)) {
          if (!g.f.length) continue;
          used.add(key);
          const L = [];
          for (let i = 0; i < g.p.length; i += 3) L.push(`v ${f3(g.p[i])} ${f3(g.p[i + 2])} ${f3(-g.p[i + 1])}`);
          for (let i = 0; i < g.uv.length; i += 2) L.push(`vt ${f3(g.uv[i])} ${f3(g.uv[i + 1])}`);
          for (let i = 0; i < g.n.length; i += 3) L.push(`vn ${f3(g.n[i])} ${f3(g.n[i + 2])} ${f3(-g.n[i + 1])}`);
          L.push(`g ${name}_${key}`, `usemtl ${key}`);
          for (let i = 0; i < g.f.length; i += 3) {
            const a = g.f[i] + base, b = g.f[i + 1] + base, c = g.f[i + 2] + base;
            L.push(`f ${a}/${a}/${a} ${b}/${b}/${b} ${c}/${c}/${c}`);
          }
          base += g.count;
          obj.push(L.join("\n") + "\n");
        }
      }
      const files = [], mtl = ["# Materials for stormont.obj\n"];
      for (const key of used) {
        const m = M[key][0], tex = m.colorTexture?.data;
        let rgb = m.color ? [m.color.r, m.color.g, m.color.b] : [200, 200, 200], alpha = m.color ? m.color.a : 1;
        if (tex) {                                                  // average texture colour for viewers without textures
          const d = tex.getContext("2d", { willReadFrequently: true }).getImageData(0, 0, tex.width, tex.height).data, sum = [0, 0, 0];
          for (let i = 0; i < d.length; i += 4) { sum[0] += d[i]; sum[1] += d[i + 1]; sum[2] += d[i + 2]; }
          rgb = sum.map(v => v / (d.length / 4));
        }
        const c = (v) => (v / 255).toFixed(4);
        mtl.push(`newmtl ${key}`, `Kd ${rgb.map(c).join(" ")}`, `Ka 0 0 0`, `Ks ${m.metallic > 0.4 ? "0.5 0.5 0.5" : "0.05 0.05 0.05"}`, `Ns ${Math.round((1 - m.roughness) * 200 + 10)}`);
        if (alpha < 1) mtl.push(`d ${alpha.toFixed(2)}`, `Tr ${(1 - alpha).toFixed(2)}`);
        if (m.emissiveColor) mtl.push(`Ke ${[m.emissiveColor.r, m.emissiveColor.g, m.emissiveColor.b].map(c).join(" ")}`);
        if (tex) { mtl.push(`map_Kd textures/${key}.png`); files.push({ name: `textures/${key}.png`, canvas: tex }); }
        mtl.push("illum 2", "");
      }
      return { obj, mtl: mtl.join("\n"), files };
    }
    // Minimal store-only ZIP writer (no compression library needed)
    const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
    const crc32 = (u8) => { let c = 0xffffffff; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; };
    function zip(entries) {
      const enc = new TextEncoder(), chunks = [], central = [], now = new Date();
      const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
      const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
      let offset = 0;
      for (const { name, data } of entries) {
        const nm = enc.encode(name), crc = crc32(data);
        const h = new DataView(new ArrayBuffer(30));
        h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(10, dosTime, true); h.setUint16(12, dosDate, true); h.setUint32(14, crc, true);
        h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nm.length, true);
        chunks.push(h, nm, data);
        const c = new DataView(new ArrayBuffer(46));
        c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(12, dosTime, true); c.setUint16(14, dosDate, true); c.setUint32(16, crc, true);
        c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, nm.length, true); c.setUint32(42, offset, true);
        central.push(c, nm);
        offset += 30 + nm.length + data.length;
      }
      const size = central.reduce((s, x) => s + x.byteLength, 0), e = new DataView(new ArrayBuffer(22));
      e.setUint32(0, 0x06054b50, true); e.setUint16(8, entries.length, true); e.setUint16(10, entries.length, true);
      e.setUint32(12, size, true); e.setUint32(16, offset, true);
      return new Blob([...chunks, ...central, e], { type: "application/zip" });
    }
    const concatBytes = (parts) => { const enc = new TextEncoder(), arrs = parts.map(p => enc.encode(p)), out = new Uint8Array(arrs.reduce((s, a) => s + a.length, 0)); let o = 0; for (const a of arrs) { out.set(a, o); o += a.length; } return out; };
    const canvasBytes = (cv) => new Promise(res => cv.toBlob(b => b.arrayBuffer().then(buf => res(new Uint8Array(buf))), "image/png"));
    async function buildModelZip() {
      const { obj, mtl, files } = buildOBJ();
      const readme = "Parliament Buildings, Stormont - schematic model exported from the ArcGIS scene.\n\nstormont.obj  geometry (metres, Y up, +X east, -Z north, origin at the building centre on the ground)\nstormont.mtl  materials; textures/ holds the tiling stone, granite, lead, oak, carpet and marble maps\n\nObjects: building, roof, terrace, glazing, interiors, lighting, statue, cars, trees_1..6.\nGround surfaces (lawns, roads, paving) are draped in the web scene and are not included.\n";
      const entries = [{ name: "stormont.obj", data: concatBytes(obj) }, { name: "stormont.mtl", data: concatBytes([mtl]) }, { name: "README.txt", data: concatBytes([readme]) }];
      for (const f of files) entries.push({ name: f.name, data: await canvasBytes(f.canvas) });
      return zip(entries);
    }
    const exportBtn = document.getElementById("export");
    async function exportModel() {
      if (exportBtn.disabled) return;
      exportBtn.disabled = true; exportBtn.style.opacity = 0.5;
      try {
        const blob = await buildModelZip(), a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = "stormont-obj.zip";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      } catch (err) { console.error("OBJ export failed", err); }
      exportBtn.disabled = false; exportBtn.style.opacity = "";
    }
    exportBtn.addEventListener("click", exportModel);
    const resetView = () => { toggleAutoOrbit(false); flyTo(HOME, 3000); };
    $("reset").addEventListener("click", resetView);

    window.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT" && e.key.startsWith("Arrow")) return;
      if (/^[1-4]$/.test(e.key)) { stopPlay(); target = +e.key - 1; }
      else if (e.key === " ") { e.preventDefault(); setPlay(!playing); }
      else if (e.key === "]") { stopPlay(); target = Math.min(LAST, Math.floor(target + 1.001)); }
      else if (e.key === "[") { stopPlay(); target = Math.max(0, Math.ceil(target - 1.001)); }
      else if (e.key === "o") toggleAutoOrbit();
      else if (e.key === "r") resetView();
      else if (e.key === "e") exportModel();
    });

    // ------------------------------------------------------------------
    // Frame loop
    // ------------------------------------------------------------------
    let prev = performance.now(), drawStart = 0, drawn = 1;
    function frame(now) {
      const dt = Math.min(0.1, (now - prev) / 1000); prev = now;
      if (playing && now > holdUntil && Math.abs(current - target) < 0.004) {
        if (target >= LAST) setPlay(false);
        else { target = Math.min(LAST, Math.floor(target + 1e-6) + 1); holdUntil = now + 5200; }
      }
      // exponential follow gives smooth morphs from clicks, keys and the slider
      const k = scrubbing ? 14 : (playing ? 0.9 : 1.8);
      current += (target - current) * (1 - Math.exp(-dt * k));
      if (Math.abs(target - current) < 0.0005) current = target;
      applyStage(current);
      updateUI(current);

      if (drawStart && drawn < sketchPaths.length) {                    // progressive sketch "drawing"
        const n = Math.min(sketchPaths.length, Math.ceil(((now - drawStart) / 5200) * sketchPaths.length));
        if (n !== drawn) { drawn = n; sketchGraphic.geometry = new Polyline({ paths: toMapPaths(sketchPaths.slice(0, n)), hasZ: true, spatialReference: SR }); }
      }
      if (autoOrbit && orbit) setCam({ ...orbit, heading: orbit.heading + dt * 4 });
      requestAnimationFrame(frame);
    }

    // A known SceneView race when an edged layer flips between opaque and translucent rejects a
    // promise with "no object" after the edges were already rebuilt; it has no visible effect.
    window.addEventListener("unhandledrejection", (e) => { if (e.reason?.message === "no object") e.preventDefault(); });

    window.stormont = { view, HOME, get stage() { return current; }, setStage: (s, instant) => { target = s; if (instant) current = s; }, orbit: (o) => setCam(o) };

    try {
      await view.when();
      await Promise.race([
        new Promise(res => { const poll = setInterval(() => { if (!view.updating) { clearInterval(poll); res(); } }, 200); }),
        new Promise(res => setTimeout(res, 6000))
      ]);
      $("loader").classList.add("gone");
      drawStart = performance.now();
      loadRealisticTrees().catch(err => console.warn("Realistic trees unavailable", err));
      flyTo(HOME, 5200);
      requestAnimationFrame(frame);
    } catch (err) {
      console.error(err);
      $("loader").classList.add("error");
      $("loaderText").textContent = "The 3D view could not start (WebGL2 is required).";
    }
  </script>
</body>
</html>
